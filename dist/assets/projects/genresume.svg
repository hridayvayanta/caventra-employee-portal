  <text x="600" y="650" text-anchor="middle" font-family="'Syne', 'Outfit', sans-serif" font-size="38" font-weight="800" letter-spacing="6" fill="url(#gold)">GENRESUME</text>
  <text x="600" y="685" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="15" font-weight="400" letter-spacing="3" fill="#8f8b84">CAREER DEVELOPMENT &amp; SMART PLATFORM</text>
