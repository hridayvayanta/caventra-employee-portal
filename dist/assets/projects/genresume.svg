    <rect x="36" y="335" width="110" height="12" rx="3" fill="url(#gold)"/>
    <rect x="36" y="360" width="288" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="36" y="360" width="240" height="8" rx="4" fill="url(#gold)"/>
    <rect x="36" y="380" width="288" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
