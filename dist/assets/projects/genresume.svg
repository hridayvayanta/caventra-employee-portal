      <stop offset="0%" stop-color="#14181b"/>
      <stop offset="100%" stop-color="#0d1012"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3d3bc"/>
      <stop offset="50%" stop-color="#c9b8a0"/>
      <stop offset="100%" stop-color="#8f7e65"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)"/>
  <!-- Resume Document Frame -->
  <g transform="translate(420, 110)">
    <rect width="360" height="480" rx="16" fill="rgba(22,27,31,0.95)" stroke="url(#gold)" stroke-width="2"/>
