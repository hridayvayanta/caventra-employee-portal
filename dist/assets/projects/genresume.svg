    <rect x="124" y="54" width="180" height="14" rx="4" fill="url(#gold)"/>
    <rect x="124" y="78" width="120" height="10" rx="3" fill="#8f8b84"/>
    <line x1="36" y1="140" x2="324" y2="140" stroke="rgba(201,184,160,0.2)" stroke-width="1.5"/>
    <!-- Content Sections -->
    <rect x="36" y="165" width="100" height="12" rx="3" fill="url(#gold)"/>
    <rect x="36" y="190" width="288" height="8" rx="2" fill="rgba(236,230,220,0.4)"/>
    <rect x="36" y="208" width="250" height="8" rx="2" fill="rgba(236,230,220,0.3)"/>
    <rect x="36" y="226" width="270" height="8" rx="2" fill="rgba(236,230,220,0.3)"/>
    <!-- Skills Pills -->
    <rect x="36" y="260" width="80" height="12" rx="3" fill="url(#gold)"/>
    <rect x="36" y="285" width="60" height="18" rx="9" fill="rgba(201,184,160,0.15)" stroke="url(#gold)" stroke-width="1"/>
    <rect x="106" y="285" width="70" height="18" rx="9" fill="rgba(201,184,160,0.15)" stroke="url(#gold)" stroke-width="1"/>
    <rect x="186" y="285" width="65" height="18" rx="9" fill="rgba(201,184,160,0.15)" stroke="url(#gold)" stroke-width="1"/>
