<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121619"/>
      <stop offset="100%" stop-color="#0b0e10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3d3bc"/>
      <stop offset="50%" stop-color="#c9b8a0"/>
      <stop offset="100%" stop-color="#8f7e65"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(201,184,160,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="600" cy="375" r="320" fill="none" stroke="rgba(201,184,160,0.12)" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="600" cy="375" r="220" fill="none" stroke="rgba(201,184,160,0.2)" stroke-width="1.5"/>
  <!-- Isometric Architectural Structure -->
  <g transform="translate(600, 340)">
    <!-- Central Tower -->
    <polygon points="0,-160 140,-80 140,80 0,0" fill="rgba(201,184,160,0.25)" stroke="url(#gold)" stroke-width="2"/>
    <polygon points="0,-160 -140,-80 -140,80 0,0" fill="rgba(22,27,31,0.85)" stroke="url(#gold)" stroke-width="2"/>
    <polygon points="0,-160 140,-80 0,-10 -140,-80" fill="rgba(227,211,188,0.35)" stroke="url(#gold)" stroke-width="2"/>
    <!-- Wireframe Floorplan projections -->
    <line x1="0" y1="0" x2="0" y2="140" stroke="url(#gold)" stroke-width="2.5"/>
    <line x1="140" y1="80" x2="240" y2="140" stroke="rgba(201,184,160,0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="-140" y1="80" x2="-240" y2="140" stroke="rgba(201,184,160,0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polygon points="0,140 180,240 0,340 -180,240" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>
  <text x="600" y="580" text-anchor="middle" font-family="'Syne', 'Outfit', sans-serif" font-size="44" font-weight="800" letter-spacing="8" fill="url(#gold)">PLINTH</text>
  <text x="600" y="620" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="400" letter-spacing="4" fill="#8f8b84">AI-POWERED ARCHITECTURE &amp; CONSTRUCTION ECOSYSTEM</text>
</svg>